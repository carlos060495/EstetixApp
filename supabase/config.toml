project_id = "estetixapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 12

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
# EL LOGIN CON CONTRASEÑA, ENCENDIDO, COMO EN PRODUCCIÓN (01-10-2026). La CLI
# traduce este `enable_signup` en encender o apagar el PROVEEDOR de email
# entero —login incluido—, no solo el alta. Apagado, en local nadie
# podía iniciar sesión con contraseña, y la descarga de datos, que la pide
# (`core/contrasena.py`), no se probaba de verdad en ninguna pasada. Las altas
# públicas contra GoTrue siguen cerradas por `[auth] enable_signup = false`:
# el alta pasa siempre por el backend. Lo sostiene
# `tests/test_llevarse_los_datos_base_real.py`, que se pone rojo si esto se apaga.
enable_signup = true
enable_confirmations = true
